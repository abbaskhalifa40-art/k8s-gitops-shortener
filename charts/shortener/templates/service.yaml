apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "shortener.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "shortener.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http

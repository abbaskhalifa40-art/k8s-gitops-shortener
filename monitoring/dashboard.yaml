# Grafana dashboard, loaded automatically by Grafana's sidecar because of
# the grafana_dashboard label. Shows the app's own metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shortener-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  shortener.json: |
    {
      "title": "Shortener",
      "uid": "shortener",
      "schemaVersion": 39,
      "time": {"from": "now-30m", "to": "now"},
      "refresh": "10s",
      "panels": [
        {"type": "timeseries", "title": "Requests per second by status",
         "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
         "targets": [{"expr": "sum by (status) (rate(http_requests_total{path!=\"/metrics\"}[1m]))", "legendFormat": "{{status}}"}]},
        {"type": "timeseries", "title": "p95 latency (seconds)",
         "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
         "targets": [{"expr": "histogram_quantile(0.95, sum by (le, path) (rate(http_request_duration_seconds_bucket{path!=\"/metrics\"}[5m])))", "legendFormat": "{{path}}"}]},
        {"type": "stat", "title": "Links created",
         "gridPos": {"x": 0, "y": 8, "w": 6, "h": 5},
         "targets": [{"expr": "sum(shortener_links_created_total)"}]},
        {"type": "stat", "title": "Redirects served",
         "gridPos": {"x": 6, "y": 8, "w": 6, "h": 5},
         "targets": [{"expr": "sum(shortener_redirects_total)"}]},
        {"type": "timeseries", "title": "API pods",
         "gridPos": {"x": 12, "y": 8, "w": 12, "h": 5},
         "targets": [{"expr": "count(up{job=~\".*shortener.*\"} == 1)", "legendFormat": "ready pods"}]}
      ]
    }

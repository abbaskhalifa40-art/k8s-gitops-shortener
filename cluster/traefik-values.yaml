# Traefik is the ingress controller: it routes http://<host> to the
# right Service. (ingress-nginx was retired by the Kubernetes project,
# so Traefik is used instead.)
service:
  spec:
    type: NodePort # no cloud load balancer on kind
ports:
  web:
    nodePort: 30080
ingressClass:
  enabled: true
  isDefaultClass: true
providers:
  kubernetesIngress:
    # Writes 127.0.0.1 into each Ingress's status. Without an address,
    # Argo CD treats the Ingress (and so the whole app) as "Progressing"
    # forever, because there's no cloud load balancer on kind.
    ingressEndpoint:
      ip: "127.0.0.1"
    # The chart also sets publishedService by default, which Traefik
    # prefers over the IP above. On kind that Service has no external
    # address, so it must be off for the IP to be used.
    publishedService:
      enabled: false
